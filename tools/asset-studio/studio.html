<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Pirate Rage: Korsan Öfkesi Asset Atölyesi</title>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script></head>
<body style="margin:0;background:#0e3b48">
<script type="module">
import * as THREE from 'three';
import {buildShip,buildLeviathan,buildChest,FLEET} from './models.js';
import {paintSeaTile,paintSeaSparkle} from './paint.js';
import {paintVfxAtlas} from './vfx.js';
import {paintWorldScroll} from './ui-paint.js';
import {buildIcon} from './icons.js';
import {buildMedal} from './medals.js';
import {buildEquip,buildPowderKeg,buildTreasureMap,buildInventoryPlaque} from './items3d.js';
import {SHIPS,MONSTERS,BOSSES} from './catalog.js';
const ALL_SHIPS=[...SHIPS,...BOSSES];
import {buildFleetLayout,FLEET_LAYOUT} from './fleet-layout.js';
import {buildCrab,buildSerpent,buildJelly,buildTurtle,buildHydra} from './monsters.js';
import * as T from './textures.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

const ELEVATION=42*Math.PI/180;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setClearColor(0x000000,0);renderer.localClippingEnabled=true;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;renderer.outputColorSpace=THREE.SRGBColorSpace;

function stage(){
  const scene=new THREE.Scene();
  scene.add(new THREE.HemisphereLight('#d6ecff','#1d3a3c',1.1));
  const sun=new THREE.DirectionalLight('#fff1d6',2.6);sun.position.set(-60,110,70);sun.castShadow=true;
  Object.assign(sun.shadow.camera,{left:-135,right:135,top:135,bottom:-135,near:1,far:500});sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-.0006;sun.shadow.radius=3;
  scene.add(sun);const rim=new THREE.DirectionalLight('#8fd3d6',1.1);rim.position.set(50,40,-90);scene.add(rim);
  return scene;
}
function camera(span,lookY){
  const c=new THREE.OrthographicCamera(-span/2,span/2,span/2,-span/2,1,1000);
  c.position.set(0,lookY+Math.sin(ELEVATION)*300,Math.cos(ELEVATION)*300);c.lookAt(0,lookY,0);c.updateMatrixWorld();c.updateProjectionMatrix();return c;
}
function prepare(obj){
  const plane=new THREE.Plane(new THREE.Vector3(0,1,0),-(obj.userData.waterline??0)-(obj.position.y||0)*0);
  obj.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;const ms=Array.isArray(o.material)?o.material:[o.material];ms.forEach(m=>{m.clippingPlanes=[plane];m.clipShadows=true;});}});
}
function shot(scene,cam,frame){
  const S=frame*2;renderer.setSize(S,S,false);renderer.render(scene,cam);
  const out=document.createElement('canvas');out.width=out.height=frame;const x=out.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(renderer.domElement,0,0,frame,frame);return out;
}
function sheet(frames,cols){
  const f=frames[0].width,rows=Math.ceil(frames.length/cols),c=document.createElement('canvas');c.width=f*cols;c.height=f*rows;const x=c.getContext('2d');
  frames.forEach((fr,i)=>x.drawImage(fr,(i%cols)*f,Math.floor(i/cols)*f));return c;
}
function anchorOf(cam,frame,p=new THREE.Vector3()){const v=p.clone().project(cam);return{x:+((v.x+1)/2*frame).toFixed(1),y:+((1-v.y)/2*frame).toFixed(1)};}
function exportCanvas(c){return{webp:c.toDataURL('image/webp',.9),png:c.toDataURL('image/png')};}

window.renderShipSheet=(key,{dirs=16,frame=192,span=104,lookY=9}={})=>{
  const cam=camera(span,lookY),frames=[];
  for(let i=0;i<dirs;i++){const h=i*Math.PI*2/dirs,scene=stage(),ship=buildShip(FLEET[key],{heading:h});prepare(ship);ship.rotation.y=Math.PI-h;scene.add(ship);frames.push(shot(scene,cam,frame));}
  return{...exportCanvas(sheet(frames,dirs/2)),frame,dirs,anchor:anchorOf(cam,frame)};
};
window.renderLeviathan=({count=8,frame=256,span=132,look='deep'}={})=>{
  const cam=camera(span,2),frames=[];
  for(let i=0;i<count;i++){const scene=stage(),m=buildLeviathan(i/count*Math.PI*2,look);prepare(m);scene.add(m);frames.push(shot(scene,cam,frame));}
  return{...exportCanvas(sheet(frames,4)),frame,count,anchor:anchorOf(cam,frame)};
};
window.renderChests=({frame=128,span=28}={})=>{
  const cam=camera(span,2),frames=[];
  for(const kind of ['wood','gilded']){const scene=stage(),c=buildChest(kind);prepare(c);c.rotation.y=-.45;scene.add(c);frames.push(shot(scene,cam,frame));}
  return{...exportCanvas(sheet(frames,2)),frame,anchor:anchorOf(cam,frame)};
};
function cameraAt(span,elevDeg){const e=elevDeg*Math.PI/180,c=new THREE.OrthographicCamera(-span/2,span/2,span/2,-span/2,1,1200);c.position.set(0,Math.sin(e)*500,Math.cos(e)*500);c.lookAt(0,0,0);c.updateMatrixWorld();c.updateProjectionMatrix();return c;}
window.renderSeaTile=()=>exportCanvas(paintSeaTile());
window.renderVfxAtlas=()=>({...exportCanvas(paintVfxAtlas()),cell:128,cols:8,rows:6});
window.renderWorldScroll=()=>exportCanvas(paintWorldScroll());
window.renderSeaSparkle=()=>({...exportCanvas(paintSeaSparkle()),frame:128,frames:8});
let envMap=null;
window.renderIcon=(name,{frame=256,margin=.8}={})=>{const scene=stage(),icon=buildIcon(name);scene.add(icon);icon.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
  envMap??=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),.04).texture;scene.environment=envMap;scene.environmentIntensity=.55;
  const key=new THREE.DirectionalLight('#fff1d6',1.4);key.position.set(-8,14,12);scene.add(key);
  // Kamerayı modelin sınır küresine sığdır (userData.cam yalnızca bakış yönünü verir).
  const c=icon.userData.cam,box=new THREE.Box3().setFromObject(icon),sphere=box.getBoundingSphere(new THREE.Sphere());
  const dir=new THREE.Vector3(...c.pos).sub(new THREE.Vector3(...c.look)).normalize(),fov=34,dist=sphere.radius*(icon.userData.flat?.74:margin)/Math.sin(fov/2*Math.PI/180);
  const cam=new THREE.PerspectiveCamera(fov,1,.1,500);cam.position.copy(sphere.center).addScaledVector(dir,dist);cam.lookAt(sphere.center);
  return{...exportCanvas(shot(scene,cam,frame)),frame};};
// Hazır bir 3B nesneyi ikon olarak çeker (renderIcon ile aynı ışık/ortam ve kadraj)
function iconShot(icon,frame,margin=.8){const scene=stage();scene.add(icon);icon.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
  envMap??=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),.04).texture;scene.environment=envMap;scene.environmentIntensity=.8;
  const key=new THREE.DirectionalLight('#fff1d6',1.6);key.position.set(-8,14,12);scene.add(key);
  const c=icon.userData.cam,box=new THREE.Box3().setFromObject(icon),sphere=box.getBoundingSphere(new THREE.Sphere());
  const dir=new THREE.Vector3(...c.pos).sub(new THREE.Vector3(...c.look)).normalize(),fov=34,dist=sphere.radius*margin/Math.sin(fov/2*Math.PI/180);
  const cam=new THREE.PerspectiveCamera(fov,1,.1,500);cam.position.copy(sphere.center).addScaledVector(dir,dist);cam.lookAt(sphere.center);return shot(scene,cam,frame);}
// Donanım atlası: 4 sütun (yelken, pruva, zırh, kundak) × 3 satır (sıradan, nadir, destansı)
window.renderEquipAtlas=({cell=192}={})=>{const frames=[];for(let r=0;r<3;r++)for(const sl of ['sail','figure','armor','carriage'])frames.push(iconShot(buildEquip(sl,r),cell,.84));return{...exportCanvas(sheet(frames,4)),cell};};
window.renderItem=(name,{frame=256}={})=>({...exportCanvas(iconShot(({powder:buildPowderKeg,treasure:buildTreasureMap,inventory:buildInventoryPlaque})[name](),frame,.82)),frame});
// Önizleme: seçili gemileri tek açıdan (güneybatıya bakış) büyük karede, deniz zeminli çeker
window.renderMedalAtlas=(list,{cell=192,cols=6}={})=>({...exportCanvas(sheet(list.map(([n,t])=>iconShot(buildMedal(n,t),cell,.86)),cols)),cell,cols});
window.renderMineSprite=({frame=128,span=18}={})=>{const scene=stage(),m=buildIcon('icon-mine');m.userData.waterline=2.6;prepare(m);scene.add(m);
  const foam=new THREE.Mesh(new THREE.PlaneGeometry(16,16),new THREE.MeshBasicMaterial({map:T.foamTexture({seed:12,color:'220,245,240',strength:.7,inner:.3}),transparent:true,depthWrite:false}));foam.rotation.x=-Math.PI/2;foam.position.y=2.65;scene.add(foam);
  const cam=camera(span,3.5);return{...exportCanvas(shot(scene,cam,frame)),frame,anchor:anchorOf(cam,frame,new THREE.Vector3(0,2.6,0))};};
window.renderCatalogShip=(id,{dirs=16,frame=192}={})=>{const spec=ALL_SHIPS.find(x=>x.id===id),span=spec.span,cam=camera(span,span*.087),frames=[];
  for(let i=0;i<dirs;i++){const h=i*Math.PI*2/dirs,scene=stage(),ship=buildShip(spec.def,{heading:h});prepare(ship);ship.rotation.y=Math.PI-h;scene.add(ship);frames.push(shot(scene,cam,frame));}
  return{...exportCanvas(sheet(frames,dirs/2)),frame,dirs,span,anchor:anchorOf(cam,frame)};};
const MONSTER_BUILDERS={crab:buildCrab,serpent:buildSerpent,jelly:buildJelly,turtle:buildTurtle,hydra:buildHydra,kraken:(pal,phase)=>buildLeviathan(phase,pal.look)};
window.renderCatalogMonster=(id,{count=8,frame=256,span=140}={})=>{const spec=MONSTERS.find(x=>x.id===id),cam=camera(span,4),frames=[];
  for(let i=0;i<count;i++){const scene=stage(),m=MONSTER_BUILDERS[spec.kind](spec.pal,i/count*Math.PI*2);prepare(m);scene.add(m);frames.push(shot(scene,cam,frame));}
  return{...exportCanvas(sheet(frames,4)),frame,count,span,anchor:anchorOf(cam,frame)};};
// Portre atlası v2: src/campaign.ts sırası (36 NPC, 18 canavar, boss). 10 sütun, 96 px.
window.renderPortraitsV2=(order,{cell=96,cols=10}={})=>{const legacy={'n1-2-light':'scout','n1-2-heavy':'raider','n2-1-heavy':'warship'},legacyMon={'m2-1':'deep','m8-1':'storm'};
  const frames=order.map(id=>{const scene=stage();let cam;
    if(id.startsWith('m')){let m;if(legacyMon[id])m=buildLeviathan(.6,legacyMon[id]);else{const spec=MONSTERS.find(x=>x.id===id);m=MONSTER_BUILDERS[spec.kind](spec.pal,.6);}prepare(m);scene.add(m);cam=camera(92,10);}
    else{const def=legacy[id]?FLEET[legacy[id]]:ALL_SHIPS.find(x=>x.id===id).def,ship=buildShip(def,{heading:Math.PI*1.25});prepare(ship);ship.rotation.y=Math.PI-Math.PI*1.25;scene.add(ship);const L=def.hull.L;cam=camera(L*1.12,L*.19);}
    return shot(scene,cam,cell);});
  return{...exportCanvas(sheet(frames,cols)),cell,cols};};

// Filo adası yerleşim şablonu: 2:1 izometrik (30°), 16:9 tuval; kaidelerin ekran konumları da döner
window.renderFleetLayout=({w=1920,h=1080,span=100}={})=>{const scene=stage(),m=buildFleetLayout();m.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});scene.add(m);
  const e=30*Math.PI/180,a=w/h,cam=new THREE.OrthographicCamera(-span/2,span/2,span/2/a,-span/2/a,1,1200);cam.position.set(0,Math.sin(e)*500,Math.cos(e)*500);cam.lookAt(0,0,0);cam.updateMatrixWorld();cam.updateProjectionMatrix();
  renderer.setSize(w,h,false);renderer.render(scene,cam);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(renderer.domElement,0,0);
  const at=(d,R,y)=>{const r=d*Math.PI/180,v=new THREE.Vector3(Math.cos(r)*R,y,-Math.sin(r)*R).project(cam);return{deg:+d.toFixed(1),x:Math.round((v.x+1)/2*w),y:Math.round((1-v.y)/2*h)};};
  const pts=[...FLEET_LAYOUT.angles.map(d=>at(d,FLEET_LAYOUT.ringR,4.2)),...FLEET_LAYOUT.inner.map(d=>at(d,FLEET_LAYOUT.innerR,5.8))];
  return{png:c.toDataURL('image/png'),pts};};
window.studioReady=true;
</script></body></html>
