# Android test APK'sı: elle başlatılır (Actions → Android APK → Run workflow) ya da main'e her gönderimde derlenir.
# Çıkan APK "android-test" sürümüne (Releases) eklenir; telefondan indirip kurulabilir.
name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**','oyna/**','public/**','index.html','capacitor.config.json','.github/workflows/android-apk.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - run: npm run build
      # Uygulama doğrudan oyunla açılır: oyun sayfası başlangıç sayfası olur
      - run: |
          rm -rf dist-app && cp -r dist dist-app
          cp dist-app/oyna/index.html dist-app/index.html
          rm -rf dist-app/srv dist-app/yonetim
      - run: npx cap add android
      - name: Yatay ekran, tam ekran
        run: |
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
      - name: Derle
        run: cd android && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk PirateRage-test.apk
      - uses: actions/upload-artifact@v4
        with: { name: PirateRage-test-apk, path: PirateRage-test.apk }
      - name: Releases'e ekle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test
          name: Android test sürümü
          prerelease: true
          body: "Telefona kurmak için PirateRage-test.apk dosyasını indir. Bilinmeyen kaynaklardan yüklemeye izin vermek gerekebilir."
          files: PirateRage-test.apk
